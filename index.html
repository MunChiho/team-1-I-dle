<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1조I들 자기소개 페이지</title>
    <style>
      @font-face {
        font-family: "YeogiOttaeJalnan";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff")
          format("woff");
        font-weight: normal;
        font-display: swap;
      }

      body {
        background-color: #f3f5d9;
        font-family: "YeogiOttaeJalnan";
        text-decoration: none;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        background-color: #f2d06b;
        padding: 20px 40px;
        border-radius: 30px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        margin: 40px 0;
        align-items: center;
        text-align: center;
      }

      .classroom-contatiner {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
      }

      .classroom-contatiner img {
        width: 400px;
        height: auto;
        border: 5px solid white;
        margin: 0 auto;
      }

      h2 {
        text-align: center;
        color: gray;
        background-color: white;
        border-radius: 30px;
        border: 1px solid white;

        display: block;
        width: fit-content;
        margin: 20px auto;
        padding: 10px 30px;
      }

      .student-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        padding: 10px;
      }

      .student-box {
        text-decoration: none;
        text-align: center;
      }

      .student-image-box {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        background-color: #eee;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 10px;
      }

      .student-tag {
        background-color: rgb(240, 240, 100);
        color: white;
        padding: 5px 15px;
        border-radius: 20px;
        font-weight: bold;
        display: inline-block;
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🐣 SPRINT 유치원 1조 I-dle 원생 소개 🐣</h1>
      <div>우리 반 친구들을 소개합니다~</div>
    </header>

    <main>
      <div class="classroom-contatiner">
        <img src="./img/classroom.png" alt="" />
      </div>
      <h2>I-dle의 자기소개서</h2>
      <div class="student-container">
        <a href="student1.html" class="student-box">
          <div class="student-image-box">
            <img src="./img/stud1.png" alt="원생1" />
          </div>
          <div class="student-tag">문치호</div>
        </a>

        <a href="student2.html" class="student-box">
          <div class="student-image-box">
            <img src="./img/stud2.png" alt="원생1" />
          </div>
          <div class="student-tag">노진우</div>
        </a>
        <a href="student3.html" class="student-box">
          <div class="student-image-box">
            <img src="./img/stud3.png" alt="원생1" />
          </div>
          <div class="student-tag">김은진</div>
        </a>
        <a href="student4.html" class="student-box">
          <div class="student-image-box">
            <img src="./img/stud4.png" alt="원생1" />
          </div>
          <div class="student-tag">조민성</div>
        </a>
        <a href="student5.html" class="student-box">
          <div class="student-image-box">
            <img src="./img/stud5.png" alt="원생1" />
          </div>
          <div class="student-tag">이진태</div>
        </a>
        <a href="student6.html" class="student-box">
          <div class="student-image-box">
            <img src="./img/stud6.png" alt="원생1" />
          </div>
          <div class="student-tag">윤다정</div>
        </a>
        <a href="student7.html" class="student-box">
          <div class="student-image-box">
            <img src="./img/stud7.jpg" alt="원생7" />
          </div>
          <div class="student-tag">조서현</div>
        </a>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
